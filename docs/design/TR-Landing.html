document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-radius:50%;background:#00FF88;animation:trPulseDot 2s ease-in-out infinite\"><\u002Fspan>\n        LIVE ON POLYGON · SEPOLIA\n      <\u002Fdiv>\n      <h1 style=\"margin:0;font-family:'Space Grotesk';font-weight:700;font-size:66px;line-height:1.02;letter-spacing:-.03em\">KRW ↔ crypto,<br>rolled through<br><span style=\"background:linear-gradient(135deg,#00C9A7,#00FF88);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent\">on-chain escrow<\u002Fspan>.<\u002Fh1>\n      <p style=\"margin:0;font-size:17px;line-height:1.65;color:#8FA398;max-width:480px\">Premium OTC trading where every trade — even cash — is held by a smart-contract vault until both sides confirm. Non-custodial, arbitrated, audited.<\u002Fp>\n      <div style=\"display:flex;gap:14px\">\n        <button style=\"padding:15px 32px;border-radius:8px;border:none;cursor:pointer;font-family:'Space Grotesk';font-weight:700;font-size:15px;color:#03110B;background:linear-gradient(135deg,#00C9A7,#00A88A)\" style-hover=\"box-shadow:0 0 28px rgba(0,201,167,.5);transform:translateY(-1px)\" style-active=\"transform:scale(.97)\">Explore pools<\u002Fbutton>\n        <button style=\"padding:15px 32px;border-radius:8px;cursor:pointer;font-weight:600;font-size:15px;color:#F2F5F3;background:rgba(255,255,255,.04);border:1px solid rgba(143,163,152,.3)\" style-hover=\"border-color:rgba(0,201,167,.5);background:rgba(0,201,167,.06)\">Create a pool<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-family:'JetBrains Mono';font-size:11px;color:#8FA398\">SCROLL — THE COIN ROLLS WITH YOU <span style=\"display:inline-block;animation:trScrollHint 1.8s ease-in-out infinite\">↓<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- LIVE STATS BAR -->\n<section data-screen-label=\"Stats\" style=\"border-top:1px solid rgba(143,163,152,.12);border-bottom:1px solid rgba(143,163,152,.12);background:linear-gradient(180deg,#0A0F0C,#050806)\">\n  <div style=\"max-width:1280px;mar tyle=\"width:88px;height:88px;display:inline-block\">{{ st.ring }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk';font-weight:700;font-size:20px\">{{ st.title }}<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#8FA398;line-height:1.65\">{{ st.body }}<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono';font-size:10.5px;color:#00C9A7\">{{ st.tag }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <!-- lifecycle strip -->\n  <div style=\"margin-top:60px;border-radius:14px;background:#0A2E1F;background:linear-gradient(120deg,#0A2E1F,#123B2A 60%,#0A2E1F);border:1px solid rgba(0,201,167,.22);padding:34px 40px 46px\">\n    <div style=\"font-family:'JetBrains Mono';font-size:11px;letter-spacing:.14em;color:#8FA398;margin-bottom:26px\">EVERY TRADE, FIVE GLOWING STATES<\u002Fdiv>\n    <div style=\"display:flex;align-items:center\">\n      <sc-for list=\"{{ lifecycle }}\" as=\"st\" hint-placeholder-count=\"5\">\n        <div style=\"display:flex;align-items:center;flex:{{ st.flex }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px;position:relative\">\n            <div style=\"width:{{ st.size }};height:{{ st.size }};border-radius:50%;background:{{ st.bg }};border:{{ st.border }};box-shadow:{{ st.glow }};animation:{{ st.anim }}\"><\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono';font-size:10px;letter-spacing:.08em;color:{{ st.labelColor }};white-space:nowrap;position:absolute;top:28px\">{{ st.label }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ st.hasLine }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"flex:1;height:2px;background:{{ st.lineBg }}\"><\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FEATURES -->\n<section id=\"pools\" data-screen-label=\"Features\" style=\"max-width:1280px;margin:0 auto;padding:20px 40px 100px\">\n  <div style=\"display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:24px\">\n    <div style=\"border-radius:14px;background:linear-gradient(165deg,#0F1712,#0A0F0C);border:1px solid rgba(143,163,152,.14);padding:30px\">\n      <div style=\"font-family:'Space Grotesk';font-weight:700;font-size:20px;margin-bottom:8px\">A marketplace of open pools<\u002Fdiv>\n      <div style=\"font-size:13.5px;color:#8FA398;line-height:1.65;margin-bottom:20px\">Filter by direction, token, chain and escrow requirement. Bookmark the ones you're watching — they follow you across sessions.<\u002Fdiv>\n      <div style=\"border-radius:10px;background:#050806;border:1px solid rgba(143,163,152,.16);padding:16px;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center\">\n          <span style=\"font-family:'Space Grotesk';font-weight:700;font-size:14px\">USDT → KRW<\u002Fspan>\n          <div style=\"display:flex;gap:8px;align-items:center\">\n            <span style=\"padding:3px 8px;border-radius:999px;font-family:'JetBrains Mono';font-size:9px;background:rgba(0,201,167,.1);color:#00C9A7;border:1px solid rgba(0,201,167,.3)\">🔒 ESCROW<\u002Fspan>\n            <span sc-camel-on-click=\"{{ toggleBookmark }}\" style=\"cursor:pointer;font-size:15px;color:{{ bookmarkColor }}\" title=\"Bookmark this pool\">{{ bookmarkIcon }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono';font-size:15px;font-variant-numeric:tabular-nums\">10,000.00 USDT <span style=\"color:#8FA398\">→<\u002Fspan> ₩13,910,000<\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono';font-size:10.5px;color:#8FA398\">\n          <span>⬡ Polygon · ★ 4.9 · expires 2d 14h<\u002Fspan>\n          <span style=\"color:#00C9A7;cursor:pointer\" style-hover=\"color:#00FF88\">✉ Message maker<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px;font-family:'JetBrains Mono';font-size:10.5px;color:#8FA398\">♡ bookmark · ✉ ask the pool maker anything before you commit<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-for list=\"{{ features }}\" as=\"f\" hint-placeholder-count=\"2\">\n      <div style=\"border-radius:14px;background:linear-gradient(165deg,#0F1712,#0A0F0C);border:1px solid rgba(143,163,152,.14);padding:30px;display:flex;flex-direction:column;gap:10px\" style-hover=\"border-color:rgba(0,201,167,.35)\">\n        <div style=\"width:38px;height:38px;border-radius:10px;background:rgba(0,201,167,.1);border:1px solid rgba(0,201,167,.3);display:flex;align-items:center;justify-content:center;font-size:16px\">{{ f.icon }}<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk';font-weight:700;font-size:17px\">{{ f.title }}<\u002Fdiv>\n        <div style=\"font-size:13px;color:#8FA398;line-height:1.65\">{{ f.body }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- TRUST -->\n<section id=\"trust\" data-screen-label=\"Trust\" style=\"border-top:1px solid rgba(143,163,152,.12);background:#0A0F0C\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:80px 40px;display:grid;grid-template-columns:repeat(4,1fr);gap:28px\">\n    <sc-for list=\"{{ trust }}\" as=\"t\" hint-placeholder-count=\"4\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-family:'JetBrains Mono';font-size:11px;letter-spacing:.14em;color:#00C9A7\">{{ t.k }}<\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk';font-weight:500;font-size:16px\">{{ t.title }}<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#8FA398;line-height:1.6\">{{ t.body }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CTA + FOOTER -->\n<section data-screen-label=\"CTA\" style=\"max-width:1280px;margin:0 auto;padding:100px 40px\">\n  <div style=\"border-radius:18px;padding:64px;text-align:center;background:linear-gradient(135deg,#0A2E1F,#123B2A 55%,#0A2E1F);border:1px solid rgba(0,201,167,.25);box-shadow:0 0 60px rgba(0,201,167,.06)\">\n    <h2 style=\"margin:0 0 12px;font-family:'Space Grotesk';font-weight:700;font-size:42px;letter-spacing:-.02em\">Roll your first trade.<\u002Fh2>\n    <p style=\"margin:0 0 30px;font-size:15px;color:#8FA398\">Connect a wallet — MetaMask, WalletConnect, Coinbase or embedded — and open a pool in minutes.<\u002Fp>\n    <div style=\"display:flex;gap:14px;justify-content:center\">\n      <button sc-camel-on-click=\"{{ toggleConnect }}\" style=\"padding:15px 36px;border-radius:8px;border:none;cursor:pointer;font-family:'Space Grotesk';font-weight:700;font-size:15px;color:#03110B;background:linear-gradient(135deg,#00C9A7,#00A88A)\" style-hover=\"box-shadow:0 0 28px rgba(0,201,167,.5)\">Connect wallet<\u002Fbutton>\n      <button style=\"padding:15px 36px;border-radius:8px;cursor:pointer;font-weight:600;font-size:15px;color:#F2F5F3;background:rgba(255,255,255,.04);border:1px solid rgba(143,163,152,.3)\" style-hover=\"border-color:rgba(0,201,167,.5)\">Browse pools<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<footer style=\"border-top:1px solid rgba(143,163,152,.12)\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:28px 40px;display:flex;align-items:center;justify-content:space-between\">\n    <div style=\"display:flex;align-items:center;gap:9px\">\n      <div style=\"width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#1E5C40,#0A2E1F 70%);border:1px solid rgba(0,201,167,.5);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:9px;color:#00C9A7\">₮R<\u002Fdiv>\n      <span style=\"font-family:'Space Grotesk';font-weight:700;font-size:13px\">TetherRoll<\u002Fspan>\n    <\u002Fdiv>\n    <span style=\"font-family:'JetBrains Mono';font-size:10.5px;color:#8FA398\">© 2026 TetherRoll · contracts audited · non-custodial<\u002Fspan>\n    <div style=\"display:flex;gap:20px;font-size:12px\"><a href=\"#\" style=\"color:#8FA398\" style-hover=\"color:#00C9A7\">Docs<\u002Fa><a href=\"#\" style=\"color:#8FA398\" style-hover=\"color:#00C9A7\">GitHub<\u002Fa><a href=\"#\" style=\"color:#8FA398\" style-hover=\"color:#00C9A7\">Discord<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440},&quot;autoRoll&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Hero coin&quot;},&quot;particles&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:110,&quot;min&quot;:0,&quot;max&quot;:300,&quot;step&quot;:10,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Hero coin&quot;}}\">\nclass Component extends DCLogic {\n  state = { connected: false, bookmarked: false, tick: 0 };\n  componentDidMount() {\n    this._t0 = performance.now();\n    const step = () => {\n      const p = Math.min(1, (performance.now() - this._t0) / 1600);\n      this.setState({ tick: 1 - Math.pow(1 - p, 3) });\n      if (p < 1) this._raf = requestAnimationFrame(step);\n    };\n    this._raf = requestAnimationFrame(step);\n  }\n  componentWillUnmount() { cancelAnimationFrame(this._raf); }\n  ring(pct, split) {\n    const C = 2 * Math.PI * 36;\n    const dash = split ? `${C*0.38} ${C*0.12} ${C*0.38} ${C*0.12}` : `${C*pct} ${C}`;\n    return React.createElement('svg', { viewBox: '0 0 88 88', width: 88, height: 88 },\n      React.createElement('circle', { cx:44, cy:44, r:36, fill:'none', stroke:'rgba(143,163,152,.18)', strokeWidth:2.5 }),\n      React.createElement('circle', { cx:44, cy:44, r:36, fill:'none', stroke: split ? '#00FF88' : '#00C9A7', strokeWidth:3.5, strokeLinecap:'round', strokeDasharray:dash, transform:'rotate(-90 44 44)', style:{ filter:'drop-shadow(0 0 5px rgba(0,201,167,.6))' } }),\n      React.createElement('circle', { cx:44, cy:44, r:22, fill:'#0A2E1F', stroke:'rgba(0,201,167,.35)', strokeWidth:1 }),\n      React.createElement('text', { x:44, y:49, textAnchor:'middle', fill:'#00C9A7', fontFamily:'Space Grotesk', fontWeight:700, fontSize:13 }, '₮R'));\n  }\n  renderVals() {\n    const t = this.state.tick, g = 'rgba(143,163,152,.35)';\n    const fmt = (n) => Math.round(n).toLocaleString('en-US');\n    const autoRoll = this.props.autoRoll ?? true;\n    return {\n      connected: this.state.connected,\n      notConnected: !this.state.connected,\n      toggleConnect: () => this.setState(s => ({ connected: !s.connected })),\n      bookmarkIcon: this.state.bookmarked ? '♥' : '♡',\n      bookmarkColor: this.state.bookmarked ? '#00C9A7' : '#8FA398',\n      toggleBookmark: () => this.setState(s => ({ bookmarked: !s.bookmarked })),\n      autoRollStr: String(autoRoll),\n      particlesStr: String(this.props.particles ?? 110),\n      stats: [\n        { value: '₩' + (5.24 * t).toFixed(2) + 'B', label: '24H VOLUME' },\n        { value: fmt(847 * t), label: 'ACTIVE POOLS' },\n        { value: (18.4 * t).toFixed(1) + ' min', label: 'AVG SETTLE TIME' },\n        { value: (99.2 * t).toFixed(1) + '%', label: 'SETTLE SUCCESS' },\n      ],\n      steps: [\n        { n:'01', title:'Open or take a pool', body:'Post your side — USDT for KRW, ETH for USDC — at a fixed rate or pegged to market ±%. Takers see reputation, escrow terms and time left before committing.', tag:'RING OPEN · NOTHING AT RISK', ring: this.ring(0.12, false) },\n        { n:'02', title:'Collateral locks on-chain', body:'The crypto side — and optionally the KRW provider\\u2019s own collateral — locks in the EscrowVault. The vault ring closes. Nobody, including us, can move it.', tag:'RING CLOSED · FUNDS LOCKED', ring: this.ring(1, false) },\n        { n:'03', title:'Confirm & release', body:'Fiat is sent and confirmed in the encrypted trade room. Both confirmations split the ring open and settle atomically. Disputes go to arbitration with evidence.', tag:'RING SPLIT · SETTLED', ring: this.ring(1, true) },\n      ],\n      lifecycle: [\n        { label:'CREATED', size:'14px', bg:'#00C9A7', border:'none', glow:'0 0 10px rgba(0,201,167,.5)', anim:'none', labelColor:'#00C9A7', hasLine:true, lineBg:'#00C9A7', flex:'1 1 0%' },\n        { label:'LOCKED', size:'14px', bg:'#00C9A7', border:'none', glow:'0 0 10px rgba(0,201,167,.5)', anim:'none', labelColor:'#00C9A7', hasLine:true, lineBg:'#00C9A7', flex:'1 1 0%' },\n        { label:'FIAT SENT', size:'16px', bg:'#0F1712', border:'2px solid #00FF88', glow:'0 0 14px rgba(0,255,136,.5)', anim:'trBreathe 2.4s ease-in-out infinite', labelColor:'#00FF88', hasLine:true, lineBg:g, flex:'1 1 0%' },\n        { label:'CONFIRMED', size:'12px', bg:'transparent', border:'2px solid '+g, glow:'none', anim:'none', labelColor:'#8FA398', hasLine:true, lineBg:g, flex:'1 1 0%' },\n        { label:'SETTLED', size:'12px', bg:'transparent', border:'2px solid '+g, glow:'none', anim:'none', labelColor:'#8FA398', hasLine:false, lineBg:'none', flex:'0 0 auto' },\n      ],\n      features: [\n        { icon:'💬', title:'Encrypted trade rooms', body:'Every match opens a private, end-to-end encrypted chat. Payment details reveal only after escrow locks; every action is state-aware.' },\n        { icon:'🪪', title:'Multi-wallet, any tier', body:'MetaMask, WalletConnect, Coinbase or Privy embedded — connect from anywhere on the site. KYC tiers raise your daily KRW limits.' },\n      ],\n      trust: [\n        { k:'01 · NON-CUSTODIAL', title:'Your keys, always', body:'Funds sit in an audited EscrowVault contract, never in a platform wallet. Release requires both parties or arbitration.' },\n        { k:'02 · AUDITED', title:'Contracts audited', body:'PoolRegistry, EscrowVault and FeeDistributor audited; reports public. 0.3% platform fee, on-chain and transparent.' },\n        { k:'03 · ARBITRATED', title:'Disputes, resolved', body:'Raise a dispute in one tap. A multisig arbitration console reviews evidence from both sides and settles from escrow.' },\n        { k:'04 · TRANSPARENT', title:'Every state on-chain', body:'Chain and escrow status shown everywhere a trade appears — cards, chats, toasts — with block-explorer links.' },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
